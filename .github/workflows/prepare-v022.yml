name: Prepare StreamRadar v0.2.2

on:
  push:
    branches: [dev/v0.2.2]
    paths:
      - 'scripts/v022_release.py'
      - '.github/workflows/prepare-v022.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.2.2 release preparation
        run: python scripts/v022_release.py
      - name: Lock and audit Node dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Preflight release
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          grep -qx '0.2.2' VERSION
          grep -q 'data-view="movies"' index.html
          grep -q "state.view === 'movies'" js/app.js
          grep -q 'movies view and calendar include movie releases' tests/e2e/streamradar.spec.js
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml index.html README.md CHANGELOG.md js/app.js js/desktop.js js/ui.js tests/e2e/streamradar.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: prepare StreamRadar v0.2.2"
          git push origin HEAD:dev/v0.2.2
