name: Prepare StreamRadar v0.2.2

on:
  push:
    branches: [dev/v0.2.2]
    paths:
      - 'scripts/v022_movies.py'
      - '.github/workflows/prepare-v022.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply movie navigation and calendar changes
        run: python scripts/v022_movies.py
      - name: Preflight syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          grep -q 'data-view="movies"' index.html
          grep -q "state.view === 'movies'" js/app.js
          grep -q '<span>Filme</span>' js/calendar.js
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js js/ui.js js/calendar.js tests/e2e/streamradar.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add movie radar navigation and calendar coverage"
          git push origin HEAD:dev/v0.2.2
