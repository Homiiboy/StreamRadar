name: Fix v0.1.2 polish review

on:
  push:
    branches: [dev/v0.1.2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.1.2

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('ui012.js')
          text = ui.read_text(encoding='utf-8')
          old = "      baseRenderReleases();\n"
          new = "      renderReleases();\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one close-search base render, found {text.count(old)}')
          ui.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_note = '<div class="settings-note"><strong>v0.1.2:</strong> Desktop UI/UX Redesign mit Sidebar, kompakter Startseite, Streaming-Rows, fokussierter Filteroberfläche und optimierter Informationshierarchie. Radar-, Kalender-, Cache- und Personalisierungslogik bleiben erhalten.</div>'
          new_note = '<div class="settings-note"><strong>v0.1.2:</strong> UI/UX Polish mit Premium-Detailansicht, globaler Suche, SVG-Icons, Rail-Navigation, „Neu seit deinem letzten Besuch“ und konsolidierter CSS-Basis.</div>'
          if old_note not in html:
              raise SystemExit('Settings note not found')
          index.write_text(html.replace(old_note, new_note), encoding='utf-8')
          PY
          node --check ui012.js
          git diff --check

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui012.js index.html
          git commit -m "fix: preserve v0.1.2 polish after search close"
          git push origin HEAD:dev/v0.1.2
