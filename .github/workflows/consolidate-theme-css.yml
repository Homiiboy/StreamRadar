name: Consolidate StreamRadar Theme CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate themes into styles.css
        shell: bash
        run: |
          if [ ! -f themes.css ]; then
            echo "themes.css is already consolidated."
            exit 0
          fi
          printf '\n\n/* === StreamRadar v0.5.2 consolidated selectable themes === */\n\n' >> styles.css
          cat themes.css >> styles.css
          rm themes.css
          grep -q 'data-streamradar-theme="netflix"' styles.css
          grep -q 'data-streamradar-theme="cyberpunk"' styles.css
          grep -q 'data-streamradar-theme="glass"' styles.css

      - name: Commit consolidated stylesheet
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to consolidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css themes.css
          git commit -m "refactor: consolidate theme CSS into styles.css [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
