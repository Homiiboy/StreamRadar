name: Prepare StreamRadar v0.1.2

on:
  push:
    branches: [dev/v0.1.2]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.1.2

      - name: Prepare release tree
        run: python scripts/prepare-v012.py

      - name: Preflight checks
        run: |
          node --check app.js
          node --check desktop.js
          node --check ui011.js
          node --check ui012.js
          node --check scripts/build-desktop.mjs
          test -s styles.css
          test -s v012.css
          test -s OldCss/v011.css
          ! test -e v011.css
          ! grep -q 'OldCss/.*\.css' index.html
          grep -q 'v012.css' index.html
          grep -q 'ui012.js' index.html
          grep -qx '0.1.2' VERSION
          git diff --check

      - name: Commit prepared release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare StreamRadar v0.1.2 release tree"
          git push origin HEAD:dev/v0.1.2
