name: Reorganize legacy CSS

on:
  push:
    branches: [chore/old-css-folder]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/old-css-folder

      - name: Move legacy version CSS and update references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p OldCss
          for file in v003.css v004.css v005.css v006.css v007.css v008.css v009.css v0010.css v0100.css; do
            test -f "$file"
            git mv "$file" "OldCss/$file"
          done

          python - <<'PY'
          from pathlib import Path

          legacy = ['v003.css','v004.css','v005.css','v006.css','v007.css','v008.css','v009.css','v0010.css','v0100.css']
          for filename in ['index.html', 'scripts/build-desktop.mjs', '.github/workflows/validate.yml', 'README.md']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for css in legacy:
                  text = text.replace(css, f'OldCss/{css}')
              path.write_text(text, encoding='utf-8')

          build = Path('scripts/build-desktop.mjs')
          text = build.read_text(encoding='utf-8')
          old = "for (const file of files) {\n  await cp(resolve(root, file), resolve(dist, file));\n}"
          new = "for (const file of files) {\n  const target = resolve(dist, file);\n  await mkdir(dirname(target), { recursive: true });\n  await cp(resolve(root, file), target);\n}"
          if old not in text:
              raise SystemExit('Desktop copy loop not found')
          build.write_text(text.replace(old, new), encoding='utf-8')

          readme = Path('OldCss/README.md')
          readme.write_text('''# OldCss\n\nHier liegen die historischen versionsbezogenen CSS-Patches von StreamRadar.\n\nRegel: Die CSS-Datei der aktuellen Version bleibt im Repository-Root. Sobald eine neue Version erscheint, wird die bisher aktuelle Versions-CSS in diesen Ordner verschoben. `styles.css` bleibt als gemeinsame Basis dauerhaft im Root.\n\nAktuell archiviert: v0.0.3 bis v0.1.0. Die aktuelle `v011.css` für v0.1.1 bleibt im Root.\n''', encoding='utf-8')
          PY

          git status --short

      - name: Commit cleanup to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: archive legacy CSS patches"
          git push origin HEAD:chore/old-css-folder
