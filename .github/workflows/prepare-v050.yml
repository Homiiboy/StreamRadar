name: Prepare StreamRadar v0.5.0

on:
  push:
    branches: [dev/v0.5.0]
    paths:
      - 'scripts/prepare-v050.py'
      - '.github/workflows/prepare-v050.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply v0.5.0 clean catalog redesign
        run: python scripts/prepare-v050.py
      - name: Refresh locked Node metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Syntax and architecture preflight
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          node --check tests/playwright.config.js
          node --check scripts/build-desktop.mjs
          grep -qx '0.5.0' VERSION
          grep -q 'clean-home-hero' index.html
          ! grep -q 'class="radar-card"' index.html
          grep -q 'internationalProviderNavUS' index.html
          grep -q 'internationalProviderNavJP' index.html
          grep -q "name: 'Sky / WOW'" js/tmdb.js
          grep -q "name: 'discovery+'" js/tmdb.js
          grep -q "name: 'Hulu', region:'US'" js/tmdb.js
          grep -q "name: 'Peacock', region:'US'" js/tmdb.js
          grep -q "name: 'd Anime Store', region:'JP'" js/tmdb.js
          grep -q 'getAllProviderMaps' js/tmdb.js
          grep -q 'watchRegion = service.region' js/tmdb.js
          grep -q "'Peacock': \['NBC'" js/catalog.js
          grep -q 'grid-auto-columns:calc((100% - 60px)/4)' styles.css
          grep -q 'StreamRadar v0.5.0 — Clean Catalog & International Providers' styles.css
          grep -q 'provider sidebar is complete, international and scrollable' tests/e2e/streamradar.spec.js
          grep -q 'Peacock opens as US catalog and exposes its networks' tests/e2e/streamradar.spec.js
          test -s OldCss/styles-v0.4.1.css
          test -s OldUi/catalog-v0.4.1.js
          npm run build:web
          test -s dist/js/catalog.js
          grep -q 'v0.5.0' dist/index.html
          grep -q 'internationalProviderNavUS' dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run StreamRadar browser QA
        run: npm run test:e2e
      - name: Commit tested v0.5.0 product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json README.md CHANGELOG.md index.html styles.css js/app.js js/tmdb.js js/polish.js js/desktop.js js/ui.js js/catalog.js src-tauri/Cargo.toml src-tauri/tauri.conf.json tests/e2e/streamradar.spec.js OldCss/styles-v0.4.1.css OldUi/catalog-v0.4.1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: StreamRadar v0.5.0 clean catalog and international providers"
          git push origin HEAD:dev/v0.5.0
