name: Prepare StreamRadar v0.4.0

on:
  push:
    branches: [dev/v0.4.0]
    paths:
      - 'scripts/prepare-v040.py'
      - '.github/workflows/prepare-v040.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.4.0 catalog redesign
        run: python scripts/prepare-v040.py
      - name: Refresh locked Node metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Preflight runtime and catalog
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          node --check tests/playwright.config.js
          node --check scripts/build-desktop.mjs
          grep -qx '0.4.0' VERSION
          grep -q 'loadCatalogPage' js/tmdb.js
          grep -q 'discoverCatalogForProvider' js/tmdb.js
          grep -q "const VERSION = '0.4.0'" js/catalog.js
          grep -q 'data-view="catalog-movies"' index.html
          grep -q 'data-view="catalog-series"' index.html
          grep -q 'id="providerNav"' index.html
          grep -q 'js/catalog.js' index.html
          grep -q 'js/catalog.js' scripts/build-desktop.mjs
          grep -q "const VERSION = '0.4.0'" js/polish.js
          test -s OldCss/styles-v0.3.0.css
          test -s OldUi/ui-v0.3.0.js
          npm run build:web
          test -s dist/js/catalog.js
          grep -q 'StreamRadar Catalog' dist/js/catalog.js
      - name: Commit prepared product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json README.md CHANGELOG.md index.html styles.css OldCss/styles-v0.3.0.css OldUi/ui-v0.3.0.js js/tmdb.js js/app.js js/polish.js js/desktop.js js/ui.js js/catalog.js js/README.md scripts/build-desktop.mjs src-tauri/Cargo.toml src-tauri/tauri.conf.json tests/e2e/streamradar.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: StreamRadar v0.4.0 streaming catalog and provider experience"
          git push origin HEAD:dev/v0.4.0
