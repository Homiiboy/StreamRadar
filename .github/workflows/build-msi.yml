name: Build StreamRadar Windows MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build-msi:
    name: Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build StreamRadar MSI
        run: npm run desktop:build

      - name: Verify MSI output
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          if (-not $msi) { throw "No MSI installer was generated." }
          $msi | ForEach-Object { Write-Host "MSI: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.1.2-Windows-x64-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.1.2-Windows-x64-EXE
          path: src-tauri/target/release/streamradar.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish MSI to repository downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "downloads" | Out-Null
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "No MSI found for repository publishing." }
          $destination = "downloads/StreamRadar_0.1.2_x64_de-DE.msi"
          Copy-Item $msi.FullName $destination -Force
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          # StreamRadar Downloads

          Hier liegen die direkt installierbaren Windows-Builds von StreamRadar.

          ## Aktuelle Windows-Version

          ### StreamRadar v0.1.2 – Windows x64

          [**StreamRadar_0.1.2_x64_de-DE.msi herunterladen**](StreamRadar_0.1.2_x64_de-DE.msi)

          - Version: ``0.1.2``
          - Plattform: Windows x64
          - Installer: MSI (``de-DE``)
          - SHA-256: ``$hash``

          Der Installer ist aktuell nicht code-signiert. Windows kann deshalb beim Öffnen einen Hinweis auf einen unbekannten Herausgeber anzeigen.

          ## Vorherige Version

          - [StreamRadar v0.1.1 – Windows x64](StreamRadar_0.1.1_x64_de-DE.msi)

          Die aktuelle MSI wird vom GitHub-Actions-Workflow **Build StreamRadar Windows MSI** auf einem Windows-Runner gebaut, geprüft und anschließend automatisch in diesen Ordner veröffentlicht.
          "@ | Set-Content -Path "downloads/README.md" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $destination "downloads/README.md"
          if (git diff --cached --quiet) {
            Write-Host "Repository MSI is already current."
            exit 0
          }
          git commit -m "chore: publish StreamRadar v0.1.2 MSI [skip ci]"
          git push origin HEAD:main
