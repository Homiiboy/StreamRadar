name: Build StreamRadar Windows MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build-msi:
    name: Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Verify v0.5.2 theme and desktop configuration
        shell: pwsh
        run: |
          if ((Get-Content "VERSION" -Raw).Trim() -ne "0.5.2") { throw "Repository version mismatch." }
          if (-not (Test-Path "js/catalog.js")) { throw "Catalog runtime missing." }
          if (-not (Test-Path "js/themes.js")) { throw "Theme runtime missing." }
          if (-not (Test-Path "themes.css")) { throw "Theme stylesheet missing." }
          if (-not (Select-String -Path "js/original-overrides.js" -Pattern 'js/themes.js' -Quiet)) { throw "Theme runtime bootstrap missing." }
          if (-not (Select-String -Path "js/original-overrides.js" -Pattern 'themes.css' -Quiet)) { throw "Theme stylesheet bootstrap missing." }
          if (-not (Select-String -Path "scripts/build-desktop.mjs" -Pattern 'js/themes.js' -Quiet)) { throw "Theme runtime is not packed by desktop build." }
          if (-not (Select-String -Path "scripts/build-desktop.mjs" -Pattern 'themes.css' -Quiet)) { throw "Theme stylesheet is not packed by desktop build." }
          if (-not (Select-String -Path "index.html" -Pattern 'internationalProviderNavUS' -Quiet)) { throw "US international provider navigation missing." }
          if (-not (Select-String -Path "index.html" -Pattern 'internationalProviderNavJP' -Quiet)) { throw "Japan international provider navigation missing." }
          if (-not (Select-String -Path "js/tmdb.js" -Pattern 'getAllProviderMaps' -Quiet)) { throw "Multi-region TMDB provider API missing." }
          if (-not (Select-String -Path "src-tauri/Cargo.toml" -Pattern 'version = "0.5.2"' -Quiet)) { throw "Rust version mismatch." }
          if (-not (Select-String -Path "src-tauri/Cargo.toml" -Pattern "tauri-plugin-opener" -Quiet)) { throw "Opener plugin missing." }
          if (-not (Select-String -Path "src-tauri/Cargo.toml" -Pattern "tauri-plugin-window-state" -Quiet)) { throw "Window state plugin missing." }
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.version -ne "0.5.2") { throw "Tauri version mismatch." }
          if (-not $config.app.withGlobalTauri) { throw "withGlobalTauri must be enabled for the vanilla desktop bridge." }

      - name: Build StreamRadar MSI
        run: npm run desktop:build

      - name: Verify MSI output
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          if (-not $msi) { throw "No MSI installer was generated." }
          if (-not (Test-Path "dist/js/catalog.js")) { throw "Catalog runtime missing from desktop dist." }
          if (-not (Test-Path "dist/js/themes.js")) { throw "Theme runtime missing from desktop dist." }
          if (-not (Test-Path "dist/themes.css")) { throw "Theme stylesheet missing from desktop dist." }
          if (-not (Select-String -Path "dist/index.html" -Pattern 'internationalProviderNavUS' -Quiet)) { throw "International provider UI missing from desktop dist." }
          if (-not (Select-String -Path "dist/js/themes.js" -Pattern "ORDER = \['radar', 'cinema', 'midnight', 'oled', 'netflix', 'cyberpunk', 'glass'\]" -Quiet)) { throw "Expected seven theme choices missing from desktop dist." }
          $msi | ForEach-Object { Write-Host "MSI: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.5.2-Windows-x64-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.5.2-Windows-x64-EXE
          path: src-tauri/target/release/streamradar.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish MSI to repository downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "downloads" | Out-Null
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "No MSI found for repository publishing." }
          $destination = "downloads/StreamRadar_0.5.2_x64_de-DE.msi"
          Copy-Item $msi.FullName $destination -Force
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          # StreamRadar Downloads

          Hier liegen die direkt installierbaren Windows-Builds von StreamRadar.

          ## Aktuelle Windows-Version

          ### StreamRadar v0.5.2 – Windows x64

          [**StreamRadar_0.5.2_x64_de-DE.msi herunterladen**](StreamRadar_0.5.2_x64_de-DE.msi)

          - Version: ``0.5.2``
          - Plattform: Windows x64
          - Installer: MSI (``de-DE``)
          - SHA-256: ``$hash``

          Der Installer ist aktuell nicht code-signiert. Windows kann deshalb beim Öffnen einen Hinweis auf einen unbekannten Herausgeber anzeigen.

          ## Verfügbare Windows-Releases

          - [StreamRadar v0.5.2](StreamRadar_0.5.2_x64_de-DE.msi) — Themes & Visual Personalization
          - [StreamRadar v0.5.1](StreamRadar_0.5.1_x64_de-DE.msi) — Selectable Themes
          - [StreamRadar v0.5.0](StreamRadar_0.5.0_x64_de-DE.msi) — Clean Catalog & International Providers
          - [StreamRadar v0.4.1](StreamRadar_0.4.1_x64_de-DE.msi) — Provider Sidebar Fixes
          - [StreamRadar v0.4.0](StreamRadar_0.4.0_x64_de-DE.msi) — Streaming Catalog & Provider Experience
          - [StreamRadar v0.3.0](StreamRadar_0.3.0_x64_de-DE.msi) — Update Center & Desktop Integration
          - [StreamRadar v0.2.2](StreamRadar_0.2.2_x64_de-DE.msi) — Film Radar
          - [StreamRadar v0.2.1](StreamRadar_0.2.1_x64_de-DE.msi) — QA & Runtime Structure
          - [StreamRadar v0.2.0](StreamRadar_0.2.0_x64_de-DE.msi) — Personalization Center
          - [StreamRadar v0.1.2](StreamRadar_0.1.2_x64_de-DE.msi) — Premium Details & Global Search
          - [StreamRadar v0.1.1](StreamRadar_0.1.1_x64_de-DE.msi) — Desktop Sidebar & Home Rows
          - [StreamRadar v0.1.0](StreamRadar_0.1.0_x64_de-DE.msi) — First Complete Radar

          Die MSI wird vom GitHub-Actions-Workflow **Build StreamRadar Windows MSI** auf einem Windows-Runner gebaut, geprüft und anschließend automatisch in diesen Ordner veröffentlicht. Das Update-Center der Desktop-App liest genau diesen veröffentlichten Stand aus.
          "@ | Set-Content -Path "downloads/README.md" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $destination "downloads/README.md"
          if (git diff --cached --quiet) {
            Write-Host "Repository MSI is already current."
            exit 0
          }
          git commit -m "chore: publish StreamRadar v0.5.2 MSI [skip ci]"
          git push origin HEAD:main
