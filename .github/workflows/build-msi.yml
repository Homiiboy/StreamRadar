name: Build StreamRadar Windows MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-msi:
    name: Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build StreamRadar MSI
        run: npm run desktop:build

      - name: Verify MSI output
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          if (-not $msi) { throw "No MSI installer was generated." }
          $msi | ForEach-Object { Write-Host "MSI: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.1.0-Windows-x64-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StreamRadar-v0.1.0-Windows-x64-EXE
          path: src-tauri/target/release/streamradar.exe
          if-no-files-found: error
          retention-days: 30
