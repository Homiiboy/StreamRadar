name: Prepare StreamRadar v0.5.3

on:
  push:
    branches: [dev/v0.5.3]
    paths:
      - 'scripts/prepare-v053.py'
      - '.github/workflows/prepare-v053.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/v0.5.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply v0.5.3 patch
        run: python scripts/prepare-v053.py

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
          for file in tests/e2e/*.js; do node --check "$file"; done

      - name: Verify poster geometry CSS
        run: |
          grep -q 'top:auto!important;bottom:9px!important;min-height:38px' styles.css
          grep -q 'right:9px!important;bottom:auto!important;background' styles.css
          grep -q 'left:9px!important;bottom:auto!important;background' styles.css
          grep -q 'provider band stays compact and never covers the poster artwork' tests/e2e/themes.spec.js

      - name: Build desktop frontend
        run: npm run build:web

      - name: Run browser regression suite
        run: npm run test:e2e

      - name: Commit prepared product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json js/themes.js styles.css tests/e2e/themes.spec.js README.md CHANGELOG.md
          git commit -m "fix: restore poster visibility in v0.5.3"
          git push origin HEAD:dev/v0.5.3
