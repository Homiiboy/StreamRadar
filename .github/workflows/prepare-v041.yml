name: Prepare StreamRadar v0.4.1

on:
  push:
    branches: [dev/v0.4.1]
    paths:
      - 'scripts/prepare-v041.py'
      - '.github/workflows/prepare-v041.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply v0.4.1 provider/sidebar patch
        run: python scripts/prepare-v041.py
      - name: Refresh locked Node metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Syntax and static preflight
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          node --check tests/playwright.config.js
          node --check scripts/build-desktop.mjs
          grep -qx '0.4.1' VERSION
          grep -q "const VERSION = '0.4.1'" js/catalog.js
          grep -q 'sidebarProviders' js/catalog.js
          grep -q "provider.name === 'Crunchyroll'" js/catalog.js
          grep -q 'overflow-y:auto' styles.css
          grep -q 'StreamRadar v0.4.1 — Provider Sidebar Fixes' styles.css
          grep -q 'provider sidebar includes Crunchyroll and scrolls vertically' tests/e2e/streamradar.spec.js
          npm run build:web
          test -s dist/js/catalog.js
          grep -q 'v0.4.1' dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run StreamRadar browser QA
        run: npm run test:e2e
      - name: Commit tested v0.4.1 product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json README.md CHANGELOG.md index.html styles.css js/app.js js/polish.js js/desktop.js js/ui.js js/catalog.js src-tauri/Cargo.toml src-tauri/tauri.conf.json tests/e2e/streamradar.spec.js .github/workflows/validate.yml .github/workflows/build-msi.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: StreamRadar v0.4.1 Crunchyroll and scrollable sidebar"
          git push origin HEAD:dev/v0.4.1
