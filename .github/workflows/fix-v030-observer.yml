name: Fix StreamRadar v0.3.0 Observer

on:
  push:
    branches: [dev/v0.3.0]
    paths:
      - 'scripts/fix-v030-observer.py'
      - '.github/workflows/fix-v030-observer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply observer fix
        run: python scripts/fix-v030-observer.py
      - name: Syntax check
        run: node --check js/desktop.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/desktop.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: prevent update center observer self-trigger loop"
          git push origin HEAD:dev/v0.3.0
