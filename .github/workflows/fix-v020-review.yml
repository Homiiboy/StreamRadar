name: Fix StreamRadar v0.2.0 review

on:
  push:
    branches: [dev/v0.2.0]
    paths:
      - 'scripts/fix-v020-review.py'
      - '.github/workflows/fix-v020-review.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.2.0
      - name: Apply review fixes if needed
        run: |
          if grep -q "setProviders(selectedProviders,false)" ui.js && grep -q "config = loadConfig()" ui.js && grep -q "baseSetView(target)" ui.js; then
            echo "Review fixes already applied."
          elif [ -f scripts/fix-v020-review.py ]; then
            python scripts/fix-v020-review.py
          fi
      - name: Validate fixes
        run: |
          node --check ui.js
          node scripts/build-desktop.mjs
          grep -q "setProviders(selectedProviders,false)" ui.js
          grep -q "config = loadConfig()" ui.js
          grep -q "baseSetView(target)" ui.js
          grep -q "Für v0.2.1 und spätere Releases gilt" README.md
          git diff --check
      - name: Commit fixes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix: harden v0.2.0 personalization state"
          git push origin HEAD:dev/v0.2.0
