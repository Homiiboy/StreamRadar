name: Validate StreamRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
      - name: Check version consistency
        run: |
          test -s VERSION
          grep -q "0.0.5" VERSION
          grep -q "v0.0.5" README.md
          grep -q "0.0.5" CHANGELOG.md
          grep -q "v0.0.5" index.html
          grep -q "APP_VERSION = '0.0.5'" app.js
      - name: Check v0.0.5 release intelligence surface
        run: |
          test -s v005.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "air_date.gte" tmdb.js
          grep -q "getSeasonProviders" tmdb.js
