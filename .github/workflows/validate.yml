name: Validate StreamRadar

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, security & release consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/playwright.config.js
          for file in tests/e2e/*.js; do node --check "$file"; done
          node --check scripts/build-desktop.mjs
          node --check scripts/test-e2e.mjs

      - name: Check v0.5.3 release surface
        run: |
          grep -qx '0.5.3' VERSION
          grep -q '"version": "0.5.3"' package.json
          grep -q '"version": "0.5.3"' package-lock.json
          grep -q '"version": "0.5.3"' src-tauri/tauri.conf.json
          grep -q 'version = "0.5.3"' src-tauri/Cargo.toml
          grep -q "const VERSION = '0.5.3'" js/themes.js
          grep -q 'v0.5.3' README.md
          grep -q '\[0.5.3\]' CHANGELOG.md

      - name: Check runtime JavaScript layout
        run: |
          test -d js
          test -s js/README.md
          for file in original-overrides.js tmdb.js tvmaze.js app.js calendar.js stability.js polish.js desktop.js ui.js catalog.js themes.js; do
            test -s "js/$file"
            test ! -e "$file"
            grep -q "js/$file" scripts/build-desktop.mjs
          done
          test "$(find js -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 11
          test -z "$(find . -maxdepth 1 -type f -name '*.js' -print -quit)"

      - name: Check selectable themes
        run: |
          THEME_CSS="styles.css"
          if [ -s themes.css ]; then THEME_CSS="themes.css"; fi
          grep -q "ORDER = \['radar', 'cinema', 'midnight', 'oled', 'netflix', 'cyberpunk', 'glass'\]" js/themes.js
          grep -q 'streamradar-theme-v1' js/themes.js
          grep -q 'data-theme-option' js/themes.js
          grep -q 'js/themes.js' js/original-overrides.js
          grep -q 'js/themes.js' scripts/build-desktop.mjs
          for theme in cinema midnight oled netflix cyberpunk glass; do
            grep -q "data-streamradar-theme=\"$theme\"" "$THEME_CSS"
          done
          grep -q 'toHaveCount(7)' tests/e2e/themes.spec.js

      - name: Check poster visibility regression fix
        run: |
          grep -q 'StreamRadar v0.5.3 — poster overlay geometry regression fix' styles.css
          grep -q 'top:auto!important;bottom:9px!important;min-height:38px' styles.css
          grep -q 'right:9px!important;bottom:auto!important;background' styles.css
          grep -q 'left:9px!important;bottom:auto!important;background' styles.css
          grep -q 'provider band stays compact and never covers the poster artwork' tests/e2e/themes.spec.js
          grep -q 'bandHeight / geometry.artHeight' tests/e2e/themes.spec.js
          grep -q 'gapToBottom' tests/e2e/themes.spec.js

      - name: Check catalog and international provider baseline
        run: |
          grep -q 'class="hero clean-home-hero shell"' index.html
          grep -q 'Was möchtest du heute sehen?' index.html
          grep -q 'internationalProviderNavUS' index.html
          grep -q 'internationalProviderNavJP' index.html
          grep -q 'getAllProviderMaps' js/tmdb.js
          grep -q "name: 'Sky / WOW'" js/tmdb.js
          grep -q "name: 'discovery+'" js/tmdb.js
          grep -q "name: 'Peacock', region:'US'" js/tmdb.js
          grep -q "name: 'd Anime Store', region:'JP'" js/tmdb.js
          grep -q 'overflow-y:auto' styles.css

      - name: Build desktop frontend package
        run: npm run build:web

      - name: Verify packed theme and poster layer
        run: |
          test -s dist/styles.css
          test -s dist/js/themes.js
          test -s dist/js/catalog.js
          grep -q 'streamradar-theme-v1' dist/js/themes.js
          grep -q "ORDER = \['radar', 'cinema', 'midnight', 'oled', 'netflix', 'cyberpunk', 'glass'\]" dist/js/themes.js
          grep -q 'top:auto!important;bottom:9px!important;min-height:38px' dist/styles.css
          if grep -q 'data-streamradar-theme="netflix"' dist/styles.css; then
            THEME_CSS="dist/styles.css"
          else
            test -s dist/themes.css
            THEME_CSS="dist/themes.css"
          fi
          grep -q 'data-streamradar-theme="netflix"' "$THEME_CSS"
          grep -q 'data-streamradar-theme="cyberpunk"' "$THEME_CSS"
          grep -q 'data-streamradar-theme="glass"' "$THEME_CSS"

      - name: Check repository hygiene
        run: |
          test ! -e scripts/prepare-v053.py
          test ! -e .github/workflows/prepare-v053.yml
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude-dir=dist --exclude-dir=node_modules .; then exit 1; fi

      - name: Run browser regression tests
        run: npm run test:e2e
