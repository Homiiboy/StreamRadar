name: Validate StreamRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
      - name: Check version consistency
        run: |
          test -s VERSION
          grep -q "0.0.3" VERSION
          grep -q "v0.0.3" README.md
          grep -q "0.0.3" CHANGELOG.md
          grep -q "v0.0.3" index.html
