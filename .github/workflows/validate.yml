name: Validate StreamRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check original-overrides.js
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
      - name: Check version consistency
        run: |
          test -s VERSION
          grep -q "0.0.7" VERSION
          grep -q "v0.0.7" README.md
          grep -q "0.0.7" CHANGELOG.md
          grep -q "v0.0.7" index.html
          grep -q "APP_VERSION = '0.0.7'" app.js
      - name: Check release intelligence surface
        run: |
          test -s v005.css
          test -s v006.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "getGlobalEpisodeEvents" tvmaze.js
          grep -q "/schedule/web" tvmaze.js
      - name: Check v0.0.7 origin intelligence
        run: |
          test -s v007.css
          test -s original-overrides.js
          grep -q "StreamRadarOriginalOverrides" original-overrides.js
          grep -q "originalScore" tmdb.js
          grep -q "originType" tmdb.js
          grep -q "override" tmdb.js
          grep -q "Marvel Studios" tmdb.js
          grep -q "Lucasfilm" tmdb.js
          grep -q "Pixar" tmdb.js
          grep -q "MANUELL" app.js
          grep -q 'original-overrides.js' index.html
