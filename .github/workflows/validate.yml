name: Validate StreamRadar

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & release consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check original-overrides.js
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
          node --check calendar.js
          node --check stability.js
          node --check polish.js
          node --check desktop.js
          node --check ui011.js
          node --check scripts/build-desktop.mjs

      - name: Check version consistency
        run: |
          test -s VERSION
          grep -qx "0.1.1" VERSION
          grep -q "v0.1.1" README.md
          grep -q "\[0.1.1\]" CHANGELOG.md
          grep -q "v0.1.1" index.html
          grep -q '"version": "0.1.1"' package.json
          grep -q '"version": "0.1.1"' src-tauri/tauri.conf.json
          grep -q 'version = "0.1.1"' src-tauri/Cargo.toml
          grep -q "VERSION = '0.1.1'" desktop.js
          grep -q "VERSION = '0.1.1'" ui011.js

      - name: Check release intelligence surface
        run: |
          test -s OldCss/v005.css
          test -s OldCss/v006.css
          test -s OldCss/v007.css
          test -s OldCss/v008.css
          test -s OldCss/v009.css
          test -s OldCss/v0010.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "getGlobalEpisodeEvents" tvmaze.js
          grep -q "/schedule/web" tvmaze.js
          grep -q "StreamRadarOriginalOverrides" original-overrides.js
          grep -q "originalScore" tmdb.js
          grep -q "BEGIN:VCALENDAR" calendar.js
          grep -q "CACHE_TTL_MS" stability.js
          grep -q "preferredProvidersOnly" stability.js
          grep -q "rebindFilterHandlers" polish.js
          grep -q "saveCompactSnapshot" polish.js

      - name: Check v0.1.1 UI UX surface
        run: |
          test -s v011.css
          test -s ui011.js
          grep -q 'class="app-sidebar"' index.html
          grep -q 'id="homeDashboard"' index.html
          grep -q 'id="homeRails"' index.html
          grep -q 'id="toggleAdvancedFilters"' index.html
          grep -q 'sidebar-link' index.html
          grep -q 'media-rail' v011.css
          grep -q 'renderHomeDashboard' ui011.js
          grep -q 'dashboardSource' ui011.js
          grep -q 'preferredFiltered' ui011.js
          grep -q 'updateFilterUX' ui011.js
          grep -q 'ui011.js' index.html
          grep -q 'v011.css' index.html

      - name: Check desktop surface
        run: |
          test -s package.json
          test -s scripts/build-desktop.mjs
          test -s assets/streamradar-icon.svg
          test -s OldCss/v0100.css
          test -s desktop.js
          test -s src-tauri/Cargo.toml
          test -s src-tauri/build.rs
          test -s src-tauri/src/main.rs
          test -s src-tauri/src/lib.rs
          test -s src-tauri/tauri.conf.json
          test -s src-tauri/capabilities/default.json
          test -s .github/workflows/build-msi.yml
          test -s downloads/README.md
          test -s OldCss/README.md
          grep -q 'downloads/StreamRadar_0.1.1_x64_de-DE.msi' README.md
          grep -q 'StreamRadar_0.1.1_x64_de-DE.msi' downloads/README.md
          grep -q '"targets": \["msi"\]' src-tauri/tauri.conf.json
          grep -q '"language": "de-DE"' src-tauri/tauri.conf.json
          grep -q 'at.streamradar.desktop' src-tauri/tauri.conf.json
          grep -q '@tauri-apps/cli' package.json
          grep -q 'streamradar-icon.svg' package.json
          grep -q 'desktop.js' index.html
          grep -q 'OldCss/v0100.css' index.html
          grep -q 'WINDOWS APP' desktop.js

      - name: Build static desktop frontend
        run: |
          node scripts/build-desktop.mjs
          test -s dist/index.html
          test -s dist/desktop.js
          test -s dist/ui011.js
          test -s dist/OldCss/v0100.css
          test -s dist/v011.css
          grep -q "v0.1.1" dist/index.html
          grep -q 'class="app-sidebar"' dist/index.html
          grep -q 'OldCss/v0100.css' dist/index.html

      - name: Check CSS archive layout
        run: |
          test -s styles.css
          test -s v011.css
          for file in v003.css v004.css v005.css v006.css v007.css v008.css v009.css v0010.css v0100.css; do
            test ! -e "$file"
            test -s "OldCss/$file"
          done

      - name: Check configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); JSON.parse(require('fs').readFileSync('src-tauri/capabilities/default.json','utf8'));"

      - name: Check repository hygiene
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude-dir=dist .; then
            echo "Merge conflict marker found"
            exit 1
          fi
          if find . -maxdepth 1 -type f -name 'tmp*' -print -quit | grep -q .; then
            echo "Temporary root file found"
            exit 1
          fi
