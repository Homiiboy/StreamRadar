name: Validate StreamRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check original-overrides.js
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
          node --check calendar.js
      - name: Check version consistency
        run: |
          test -s VERSION
          grep -q "0.0.8" VERSION
          grep -q "v0.0.8" README.md
          grep -q "0.0.8" CHANGELOG.md
          grep -q "v0.0.8" index.html
          grep -q "VERSION = '0.0.8'" calendar.js
      - name: Check release intelligence surface
        run: |
          test -s v005.css
          test -s v006.css
          test -s v007.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "getGlobalEpisodeEvents" tvmaze.js
          grep -q "/schedule/web" tvmaze.js
          grep -q "StreamRadarOriginalOverrides" original-overrides.js
          grep -q "originalScore" tmdb.js
      - name: Check v0.0.8 calendar and timeline
        run: |
          test -s v008.css
          test -s calendar.js
          grep -q 'data-view="calendar"' index.html
          grep -q 'id="calendarPanel"' index.html
          grep -q 'data-calendar-mode="day"' index.html
          grep -q 'data-calendar-mode="week"' index.html
          grep -q 'data-calendar-mode="month"' index.html
          grep -q 'data-calendar-mode="90"' index.html
          grep -q 'id="calendarWatchlistOnly"' index.html
          grep -q "renderTimeline" calendar.js
          grep -q "renderMonthGrid" calendar.js
          grep -q "BEGIN:VCALENDAR" calendar.js
          grep -q "exportICS" calendar.js
          grep -q 'calendar.js' index.html
