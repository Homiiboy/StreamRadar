name: Validate StreamRadar

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & release consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check original-overrides.js
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
          node --check calendar.js
          node --check stability.js
          node --check polish.js
          node --check desktop.js
          node --check ui.js
          node --check scripts/build-desktop.mjs

      - name: Check version consistency
        run: |
          test -s VERSION
          grep -qx "0.2.0" VERSION
          grep -q "v0.2.0" README.md
          grep -q "\[0.2.0\]" CHANGELOG.md
          grep -q "v0.2.0" index.html
          grep -q '"version": "0.2.0"' package.json
          grep -q '"version": "0.2.0"' src-tauri/tauri.conf.json
          grep -q 'version = "0.2.0"' src-tauri/Cargo.toml
          grep -q "APP_VERSION = '0.2.0'" app.js
          grep -q "VERSION = '0.2.0'" desktop.js
          grep -q "const VERSION = '0.2.0'" ui.js

      - name: Check release intelligence surface
        run: |
          test -s OldCss/v005.css
          test -s OldCss/v006.css
          test -s OldCss/v007.css
          test -s OldCss/v008.css
          test -s OldCss/v009.css
          test -s OldCss/v0010.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "getGlobalEpisodeEvents" tvmaze.js
          grep -q "/schedule/web" tvmaze.js
          grep -q "StreamRadarOriginalOverrides" original-overrides.js
          grep -q "originalScore" tmdb.js
          grep -q "BEGIN:VCALENDAR" calendar.js
          grep -q "CACHE_TTL_MS" stability.js
          grep -q "preferredProvidersOnly" stability.js
          grep -q "rebindFilterHandlers" polish.js
          grep -q "saveCompactSnapshot" polish.js

      - name: Check personalization and settings
        run: |
          grep -q "PERSONALIZATION CENTER" ui.js
          grep -q "onboardingOverlay" ui.js
          grep -q "Personalization Center" CHANGELOG.md
          grep -q "renderPersonalizedHome" ui.js
          grep -q "personalScore" ui.js
          grep -q "Dein Radar-Mix" ui.js
          grep -q "Bei deinen Diensten" ui.js
          grep -q "streamradar-personalization-v2" ui.js
          grep -q "streamradar-onboarding-v2-complete" ui.js
          grep -q "exportBackup" ui.js
          grep -q "importBackup" ui.js
          grep -q "Backup" ui.js
          grep -q "setPreferredProviders" stability.js
          grep -q "setPreferredProvidersOnly" stability.js
          grep -q "getAllProviders" stability.js
          grep -q "data-density" styles.css
          grep -q "settings-center" styles.css
          grep -q "onboarding-overlay" styles.css
          grep -q "v020-personal-rail" styles.css

      - name: Check consolidated UI foundation
        run: |
          test -s ui.js
          test -s OldUi/ui011.js
          test -s OldUi/ui012.js
          test -s OldUi/ui-v0.1.2.js
          grep -q 'class="app-sidebar"' index.html
          grep -q 'id="homeDashboard"' index.html
          grep -q 'id="homeRails"' index.html
          grep -q 'id="toggleAdvancedFilters"' index.html
          grep -q 'renderHomeDashboard' ui.js
          grep -q 'globalSearchOverlay' ui.js
          grep -q 'renderPremiumDetail' ui.js
          grep -q 'ui.js' index.html
          ! grep -q 'ui011.js' index.html
          ! grep -q 'ui012.js' index.html
          ! grep -q 'OldUi/' index.html

      - name: Check consolidated CSS surface
        run: |
          test -s styles.css
          test -s OldCss/v011.css
          test -s OldCss/v012.css
          test -s OldCss/styles-v0.1.2.css
          grep -q 'rail-heading-actions' styles.css
          grep -q 'premium-detail' styles.css
          grep -q 'StreamRadar v0.2.0 — Personalization & Settings' styles.css
          grep -q 'styles.css' index.html
          ! grep -q 'v012.css' index.html
          ! grep -q 'OldCss/.*\.css' index.html

      - name: Check desktop surface
        run: |
          test -s package.json
          test -s scripts/build-desktop.mjs
          test -s assets/streamradar-icon.svg
          test -s desktop.js
          test -s src-tauri/Cargo.toml
          test -s src-tauri/build.rs
          test -s src-tauri/src/main.rs
          test -s src-tauri/src/lib.rs
          test -s src-tauri/tauri.conf.json
          test -s src-tauri/capabilities/default.json
          test -s .github/workflows/build-msi.yml
          test -s downloads/README.md
          test -s OldCss/README.md
          test -s OldUi/README.md
          grep -q 'downloads/StreamRadar_0.2.0_x64_de-DE.msi' README.md
          node -e "const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); if(!c.bundle.targets.includes('msi')||c.bundle.windows.wix.language!=='de-DE'||c.identifier!=='at.streamradar.desktop') process.exit(1)"
          grep -q '@tauri-apps/cli' package.json
          grep -q 'streamradar-icon.svg' package.json
          grep -q 'desktop.js' index.html
          grep -q 'WINDOWS APP' desktop.js

      - name: Build static desktop frontend
        run: |
          node scripts/build-desktop.mjs
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/desktop.js
          test -s dist/ui.js
          test ! -d dist/OldCss
          test ! -d dist/OldUi
          grep -q "v0.2.0" dist/index.html
          grep -q 'class="app-sidebar"' dist/index.html
          grep -q 'ui.js' dist/index.html
          grep -q 'styles.css' dist/index.html
          grep -q 'PERSONALIZATION CENTER' dist/ui.js
          grep -q 'onboarding-overlay' dist/styles.css

      - name: Check archive layout
        run: |
          test -s styles.css
          test -s ui.js
          for file in v003.css v004.css v005.css v006.css v007.css v008.css v009.css v0010.css v0100.css v011.css v012.css; do
            test ! -e "$file"
            test -s "OldCss/$file"
          done
          test -s OldCss/styles-v0.1.2.css
          test ! -e ui011.js
          test ! -e ui012.js
          test -s OldUi/ui011.js
          test -s OldUi/ui012.js
          test -s OldUi/ui-v0.1.2.js
          grep -q 'styles-v0.1.2.css' OldCss/README.md
          grep -q 'ui-v0.1.2.js' OldUi/README.md

      - name: Check configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); JSON.parse(require('fs').readFileSync('src-tauri/capabilities/default.json','utf8'));"

      - name: Check repository hygiene
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude-dir=dist .; then
            echo "Merge conflict marker found"
            exit 1
          fi
          if find . -maxdepth 1 -type f -name 'tmp*' -print -quit | grep -q .; then
            echo "Temporary root file found"
            exit 1
          fi
          test ! -e scripts/prepare-v020.py
          test ! -e .github/workflows/prepare-v020.yml
          test ! -e .github/workflows/consolidate-ui-assets.yml
