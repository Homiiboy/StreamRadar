name: Validate StreamRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax & version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check original-overrides.js
          node --check tmdb.js
          node --check tvmaze.js
          node --check app.js
          node --check calendar.js
          node --check stability.js
      - name: Check version consistency
        run: |
          test -s VERSION
          grep -q "0.0.9" VERSION
          grep -q "v0.0.9" README.md
          grep -q "\[0.0.9\]" CHANGELOG.md
          grep -q "v0.0.9" index.html
          grep -q "VERSION = '0.0.9'" stability.js
      - name: Check release intelligence surface
        run: |
          test -s v005.css
          test -s v006.css
          test -s v007.css
          test -s v008.css
          grep -q 'id="eventFilter"' index.html
          grep -q "season-premiere" app.js
          grep -q "getGlobalEpisodeEvents" tvmaze.js
          grep -q "/schedule/web" tvmaze.js
          grep -q "StreamRadarOriginalOverrides" original-overrides.js
          grep -q "originalScore" tmdb.js
          grep -q "BEGIN:VCALENDAR" calendar.js
      - name: Check v0.0.9 stability and personalization
        run: |
          test -s v009.css
          test -s stability.js
          grep -q "CACHE_TTL_MS" stability.js
          grep -q "CACHE_KEY" stability.js
          grep -q "restoreCache" stability.js
          grep -q "saveSnapshot" stability.js
          grep -q "preferredProvidersOnly" stability.js
          grep -q "sortMode" stability.js
          grep -q "exportWatchlist" stability.js
          grep -q "importWatchlist" stability.js
          grep -q "navigator.onLine" stability.js
          grep -q "stability.js" index.html
          grep -q "v009.css" index.html
