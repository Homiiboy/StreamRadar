name: Prepare StreamRadar v0.2.0

on:
  push:
    branches: [dev/v0.2.0]
    paths:
      - 'scripts/prepare-v020.py'
      - '.github/workflows/prepare-v020.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.2.0

      - name: Prepare v0.2.0
        run: python scripts/prepare-v020.py

      - name: Normalize generated text files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['styles.css','ui.js']:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Preflight
        run: |
          node --check ui.js
          node --check app.js
          node --check stability.js
          node --check desktop.js
          node scripts/build-desktop.mjs
          test -s dist/styles.css
          test -s dist/ui.js
          test ! -d dist/OldCss
          test ! -d dist/OldUi
          grep -q "StreamRadar v0.2.0 — Personalization & Settings" ui.js
          grep -q "StreamRadar v0.2.0 — Personalization & Settings" styles.css
          grep -q "PERSONALIZATION CENTER" ui.js
          grep -q "0.2.0" VERSION
          git diff --check

      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml app.js desktop.js stability.js index.html ui.js styles.css CHANGELOG.md README.md OldCss OldUi
          git commit -m "StreamRadar v0.2.0 — Personalization & Settings"
          git push origin HEAD:dev/v0.2.0
