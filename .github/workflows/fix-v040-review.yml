name: Fix StreamRadar v0.4.0 Self Review

on:
  push:
    branches: [dev/v0.4.0]
    paths:
      - 'scripts/fix-v040-review.py'
      - '.github/workflows/fix-v040-review.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply self-review fixes
        run: python scripts/fix-v040-review.py
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and build preflight
        run: |
          node --check js/catalog.js
          node --check tests/e2e/streamradar.spec.js
          grep -q "catalog-all" js/catalog.js
          grep -q "renderCatalogSearchOverlay" js/catalog.js
          grep -q "releaseRenderReleases" js/catalog.js
          grep -q "providerMapPromise" js/catalog.js
          npm run build:web
          test -s dist/js/catalog.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run StreamRadar browser QA
        run: npm run test:e2e
      - name: Commit self-review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/catalog.js tests/e2e/streamradar.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden v0.4.0 catalog integration"
          git push origin HEAD:dev/v0.4.0
