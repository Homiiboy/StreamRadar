name: Prepare StreamRadar v0.3.0

on:
  push:
    branches: [dev/v0.3.0]
    paths:
      - 'scripts/prepare-v030.py'
      - '.github/workflows/prepare-v030.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.3.0 desktop integration
        run: python scripts/prepare-v030.py
      - name: Refresh locked Node metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Preflight JavaScript and configuration
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check tests/e2e/streamradar.spec.js
          node --check tests/playwright.config.js
          node --check scripts/build-desktop.mjs
          grep -qx '0.3.0' VERSION
          grep -q 'PUBLISHED_DOWNLOADS_URL' js/desktop.js
          grep -q 'settingsUpdatePage' js/desktop.js
          grep -q 'tauri-plugin-opener' src-tauri/Cargo.toml
          grep -q 'tauri-plugin-window-state' src-tauri/Cargo.toml
          grep -q '"withGlobalTauri": true' src-tauri/tauri.conf.json
          test -s OldCss/styles-v0.2.2.css
          npm run build:web
          test -s dist/js/desktop.js
          grep -q 'checkForUpdates' dist/js/desktop.js
      - name: Commit prepared product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json README.md CHANGELOG.md index.html styles.css OldCss/styles-v0.2.2.css js/app.js js/ui.js js/desktop.js src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/capabilities/default.json src-tauri/src/lib.rs tests/e2e/streamradar.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: StreamRadar v0.3.0 desktop integration and updates"
          git push origin HEAD:dev/v0.3.0
